name: Sync to Hugging Face Spaces

on:
  push:
    branches:
      - main

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Push to Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          git config --global user.email "noreply@deepneuro.ai"
          git config --global user.name "DeepNeuro AI Bot"

          # Create a single-commit orphan branch to avoid pushing
          # historical binary files that HF rejects
          git checkout --orphan hf-sync
          git add -A
          git commit -m "Sync to HF Space: $(git log -1 --format=%s origin/main)"

          git remote add space https://richardyoung:$HF_TOKEN@huggingface.co/spaces/richardyoung/2pac || true
          git push space hf-sync:main --force
